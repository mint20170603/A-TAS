name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Parse release commit
        id: trigger
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          first_line=${COMMIT_MESSAGE%%$'\n'*}
          if [[ $first_line =~ ^release\ ([0-9]{12})$ ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.trigger.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - name: Build release package
        if: steps.trigger.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.trigger.outputs.version }}
        run: bash .github/scripts/generate-release.sh "$VERSION"

      - name: Create GitHub Release
        if: steps.trigger.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.trigger.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create "$VERSION" A-TAS-4.0.zip manifest.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "A-TAS 4.0 $VERSION" \
            --generate-notes
